name: CI

# The port targets Ubuntu 22.04 specifically, because that is the release the
# package name map was verified against and the release the deb's dependencies
# were resolved in. Running on `latest` would pass against a different archive
# than the one the port is written for, which is the worst way for a package
# test to be green.
on:
  push:
    branches: [quattro, 'ubuntu/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test on ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # The host tools test/shell.d/base-test.sh's require_command asks for.
      # The suite skips the checks it cannot run rather than failing them, so
      # this list is about coverage, not about making the run green.
      # tzdata asks for a geographic area and then a city, and it does so even
      # under `apt-get install -y`. An unattended job that does not say so
      # hangs there forever with no error, which is the worst kind of CI
      # failure to diagnose.
      - name: Install the tools the suite requires
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          echo 'Etc/UTC' | sudo tee /etc/timezone >/dev/null
          sudo apt-get install -y --no-install-recommends \
            jq python3 lua5.4 imagemagick ffmpeg util-linux plocate \
            desktop-file-utils fontconfig file gcc x11-xkb-utils \
            ripgrep fzf socat

      - name: Report which checks will be skipped
        run: |
          for tool in node hyprctl omasnap quickshell; do
            command -v "$tool" >/dev/null || echo "not present, some checks will skip: $tool"
          done

      # Not `./test/all` directly. This tree carried a couple of dozen
      # environment-caused failures before the port started, so a job that
      # requires zero failures is permanently red, and a permanently red build
      # is indistinguishable from a broken one. This asserts that nothing that
      # used to pass has stopped passing -- and, in the other direction, that
      # nothing on the known-failures list has quietly started passing, because
      # a stale list stops meaning anything.
      - name: Run the suite
        run: ./bin/omarchy-ci-suite
        env:
          OMARCHY_CI_LOG: ${{ runner.temp }}/suite.log

      - name: Keep the log when a check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: suite-log
          path: ${{ runner.temp }}/suite.log

      # The deb is the deliverable, so the suite passing is not enough: the
      # artefact has to build, and it has to be a package dpkg accepts.
      - name: Build the deb
        run: make deb

      # A well-formed package that cannot be installed is still a broken
      # package, and dpkg-deb will happily build one. The upstream merge added
      # two default apps to the Arch package list, they reached Depends
      # untranslated, and the released deb would not install -- through a build
      # step that only ever inspected the artefact. So the dependencies are
      # resolved against the archive here, which is the check that would have
      # caught it.
      - name: Check the built package
        run: |
          deb=$(ls build/deb/*.deb)
          dpkg-deb --info "$deb" | head -20
          dpkg-deb --contents "$deb" | grep -q '^.*usr/bin/omarchy$'
          dpkg-deb --contents "$deb" | grep -q 'usr/share/omarchy/bin/'

      # apt's own resolver, as a dry run: --simulate answers whether the
      # package is installable without touching the system and without root.
      - name: The package is actually installable
        run: |
          set -euo pipefail
          # Absolute, and globbed before quoting: apt reads a bare
          # build/deb/... as the name of a package rather than as a file to
          # install, and a glob inside quotes never expands.
          shopt -s nullglob
          debs=(build/deb/*.deb)
          shopt -u nullglob
          if (( ${#debs[@]} == 0 )); then
            echo "make deb produced nothing" >&2
            exit 1
          fi
          if ! apt-get install -s --no-install-recommends "$(pwd)/${debs[0]}"; then
            echo >&2
            echo "apt cannot resolve this package. Map or declare every" >&2
            echo "Arch name in install/pkg-map.conf first." >&2
            exit 1
          fi
