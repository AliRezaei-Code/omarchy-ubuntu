<?xml version="1.0" encoding="UTF-8"?>
<!--
  The Omarchy dashboard mark: a terminal window with a prompt in it.

  Drawn from scratch for this Ubuntu port. It is deliberately glyph-only,
  strokes and fills in a single mid-tone blue, no background plate, because
  the GNOME app grid paints icons on whatever the desktop background happens to
  be, and a plate that reads on a dark theme disappears on a light one. A shape
  with no plate is the only mark that survives both.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <g fill="none" stroke="#5b6bd6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6.5" y="8.5" width="35" height="31" rx="5.5"/>
    <path d="M6.5 16.5h35"/>
  </g>

  <!-- The title bar's two controls, as the pair of dots every window has. -->
  <g fill="#5b6bd6">
    <circle cx="12" cy="12.5" r="1.5"/>
    <circle cx="17.5" cy="12.5" r="1.5"/>
  </g>

  <!-- The prompt: a chevron and a cursor. -->
  <g fill="none" stroke="#5b6bd6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 24l6 5.5-6 5.5"/>
  </g>
  <rect x="25" y="31" width="11" height="3.2" rx="1.6" fill="#5b6bd6"/>
</svg>
