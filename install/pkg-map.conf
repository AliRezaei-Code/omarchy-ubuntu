# Arch package name -> Ubuntu package name(s), for the deb backend.
#
# Tab separated:
#
#     arch_name<TAB>deb_packages[<TAB>binary_aliases]
#
# One Arch package can become several Debian packages, which is why the
# separator is a tab rather than a space. A name that is not in this table is
# passed through untouched, so an entry is only worth writing where the two
# systems disagree; a row that says `git -> git` is noise.
#
# An EMPTY deb_packages is a declaration, not an omission: somebody checked and
# there is no Ubuntu equivalent. Callers say so out loud instead of asking apt
# for a package that does not exist and reporting a failure nobody can act on.
#
# Every target here was checked against the jammy archive with
# `apt-cache policy` before it was written. A wrong entry fails loudly at
# install time, which is the intended failure mode -- a silent no-op is not.

# --- renamed packages ---------------------------------------------------

avahi	avahi-daemon
bat	bat	bat=batcat
bluez-utils	bluez
cups-pk-helper	cups
dotnet-runtime	dotnet-runtime-6.0
fcitx5-gtk	fcitx5-frontend-gtk3
fcitx5-qt	fcitx5-frontend-qt5
fd	fd-find	fd=fdfind
gvfs-mtp	gvfs-backends
gvfs-nfs	gvfs-backends
gvfs-smb	gvfs-backends
libfprint-git	libfprint-2-2
libsecret	libsecret-1-0
libvips	libvips42
libyaml	libyaml-0-2
lua51	lua5.1
mariadb-libs	libmariadb3
nautilus-python	python3-nautilus
networkmanager	network-manager
nss-mdns	libnss-mdns
nvim	neovim
noto-fonts	fonts-noto-core
noto-fonts-cjk	fonts-noto-cjk
noto-fonts-emoji	fonts-noto-color-emoji
postgresql-libs	libpq5
python-gobject	python3-gi
python-poetry-core	python3-poetry-core
qemu-user-static-binfmt	qemu-user-static
tesseract	tesseract-ocr
tesseract-data-eng	tesseract-ocr-eng
ttf-jetbrains-mono-nerd-basic	fonts-jetbrains-mono
