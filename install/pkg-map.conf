# --- no Ubuntu equivalent ----------------------------------------------
#
# Arch's own package tooling and the AUR client. There is nothing to install
# and nothing to point at, so these are named rather than mapped to whatever
# package happens to share a first letter.

pacman-contrib
expac
yay
vercmp

# Arch's signing keyring. Ubuntu's archive keys ship as an ordinary package and
# are re-verified on every `apt-get update`.
archlinux-keyring
pacman-key

# The Hyprland and Quickshell desktop shell, and the tools that only make
# sense inside it. Omarchy on Ubuntu is the GTK dashboard and the terminal UI,
# not this.

hyprland
quickshell
uwsm
hyprland-guiutils
hyprland-preview-share-picker
hyprpicker
hyprsunset

# Terminal niceties with no jammy archive package. `gum` in particular is
# replaced in-tree by a shim over the selector primitives, not by apt.

gum
fastfetch
eza
pamixer
starship
xdg-terminal-exec

# Limine boot management and the initramfs configuration that goes with it.
# Ubuntu boots through its own bootloader, and rewriting that is not something
# a package install should do.

limine
limine-svn
mkinitcpio
mkinitcpio-firmware
mkinitcpio-openssl

# Tools Omarchy ships its own version of, or that are third-party software the
# AUR carries rather than any distribution. `chromium` is here because jammy
# has no `chromium` package at all -- `chromium-browser` is a snap installer
# that prompts for a snap on first run, and a Depends line naming a package
# that does not exist makes the whole deb uninstallable rather than one
# browser missing.

aether
asdcontrol
chromium
cliamp
elsewhen
herdr
lazydocker
moonlight-qt
omasnap
owe
owe-lockfeed
ttfx

